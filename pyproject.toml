[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digitalizadora"
version = "0.1.0"
description = "Digitaliza uma página por clique na HP DeskJet Ink Advantage 2874 pelo protocolo eSCL."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pillow>=12",
    "img2pdf>=0.6.3",
    "pikepdf>=10.9",
]

[project.optional-dependencies]
development = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digitalizadora = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "hardware: needs the real printer; runs only with DIGITALIZADORA_HARDWARE_TESTS=1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "B", "UP"]
# The design contracts (section 6.1) declare enums as (str, Enum), not StrEnum.
ignore = ["UP042"]
